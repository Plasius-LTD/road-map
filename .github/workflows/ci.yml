name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  trusted_head:
    name: Trusted head admission
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject external fork execution
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]; then
            echo "External fork pull requests cannot be merged until a maintainer moves the reviewed commit to a repository-owned branch." >&2
            exit 1
          fi

  validate:
    needs: trusted_head
    if: ${{ github.event_name == 'pull_request' }}
    # Pull requests run on GitHub-hosted capacity.
    runs-on: ubuntu-latest

    steps:
      - name: Enforce trusted head admission
        if: ${{ needs.trusted_head.result != 'success' }}
        run: |
          echo "Trusted head admission failed; refusing validation." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Coverage
        run: npm run test:coverage

  validate-main:
    needs: trusted_head
    if: ${{ github.event_name != 'pull_request' }}
    # Trusted main jobs are pinned to the quarantined public-CI runner group.
    runs-on:
      group: Public CI - Quarantined
      labels:
        - self-hosted
        - Linux
        - X64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/road-map-ci
