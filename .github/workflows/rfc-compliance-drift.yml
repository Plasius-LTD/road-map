name: RFC compliance drift

on:
  schedule:
    - cron: "17 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out road-map
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check committed audit
        run: npm run rfc:audit:check

      - name: Refresh authoritative inputs without accepting changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run rfc:audit:refresh -- --remote-only
          git diff --exit-code -- docs/compliance/rfc
